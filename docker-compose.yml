# Local microservices deploy. Requires the API repos checked out next to this one:
#   ../AddTaskTodoMicroservice
#   ../DeleteTaskTodoMicroservice
#   ../GetTasksTodoMicroservice
# Set MSSQL_SA_PASSWORD to a local SQL Server password before starting.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  add-task:
    build: ../AddTaskTodoMicroservice
    environment:
      CONNECTION_STRING: "Driver={ODBC Driver 17 for SQL Server};Server=tcp:sql,1433;Database=todoapp;Uid=sa;Pwd=${MSSQL_SA_PASSWORD};Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=30;"
    ports:
      - "8003:8000"
    depends_on:
      sql:
        condition: service_healthy

  get-tasks:
    build: ../GetTasksTodoMicroservice
    environment:
      CONNECTION_STRING: "Driver={ODBC Driver 17 for SQL Server};Server=tcp:sql,1433;Database=todoapp;Uid=sa;Pwd=${MSSQL_SA_PASSWORD};Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=30;"
    ports:
      - "8001:8000"
    depends_on:
      sql:
        condition: service_healthy

  delete-task:
    build: ../DeleteTaskTodoMicroservice
    environment:
      CONNECTION_STRING: "Driver={ODBC Driver 17 for SQL Server};Server=tcp:sql,1433;Database=todoapp;Uid=sa;Pwd=${MSSQL_SA_PASSWORD};Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=30;"
    ports:
      - "8002:8000"
    depends_on:
      sql:
        condition: service_healthy

  ui:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - add-task
      - get-tasks
      - delete-task
